name: build-and-deploy
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 登录 ACR
      run: echo "${{ secrets.ACR_PASSWORD }}" | docker login crpi-6cqsp6kzvdys422n.cn-guangzhou.personal.cr.aliyuncs.com -u "${{ secrets.ACR_USER }}" --password-stdin

    - name: 构建并推送镜像
      run: |
        IMG=crpi-6cqsp6kzvdys422n.cn-guangzhou.personal.cr.aliyuncs.com/sre-demo/app
        docker build -t $IMG:${{ github.sha }} ./app
        docker tag $IMG:${{ github.sha }} $IMG:release
        docker push $IMG:${{ github.sha }}
        docker push $IMG:release
